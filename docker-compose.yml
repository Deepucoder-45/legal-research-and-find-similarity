version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: legal-research-backend
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PYTHONPATH: /app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: legal-research-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
